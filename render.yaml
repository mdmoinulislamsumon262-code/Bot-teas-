services:
  - type: web
    name: super-fast-otp-bot
    runtime: python
    # Free deployment. UptimeRobot can prevent idle spin-down, but this
    # instance has an ephemeral filesystem; local SQLite/JSON data can be lost
    # after a restart, spin-down, or redeploy.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATA_DIR
        value: ./data
